<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link href="./realgrid-style.css" rel="stylesheet" />
		<script type="text/javascript" src="./realgrid-lic.js"></script>
		<script type="text/javascript" src="./realgrid.2.9.7.min.js"></script>
		<script type="text/javascript" src="/js/jquery-3.4.0.min.js"></script>
	</head>
	<body>
		<div id="realgrid" style="width: 100%; height: 440px;">
		</div>
	</body>
</html>

<script>
	// 1. <데이터 가져와서 그리드에 표시하기>
	document.addEventListener("DOMContentLoaded", function () {
		const provider = new RealGrid.LocalDataProvider();
		const gridView = new RealGrid.GridView("realgrid");
		gridView.setDataSource(provider);

		// 필드 그리기
		provider.setFields([
			{ fieldName: "id" },
			{ fieldName: "title" }
		]);

		// 칼럼 그리기
		gridView.setColumns([
			{ name: "id", fieldName: "id" },
			{ name: "title", fieldName: "title" }
		]);

		// 데이터 불러오기 (서버 주소)
		$.getJSON("https://jsonplaceholder.typicode.com/posts", function(data) {
			console.log(data); 
			provider.fillJsonData(data, { fillMode: "set" }); // 가져온 데이터 그리드에 채워넣기 (set: 기존 데이터 덮어쓰고 새로 그림)
		});
	});

	
</script>
