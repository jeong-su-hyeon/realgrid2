<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link href="./realgrid-style.css" rel="stylesheet" />
		<script type="text/javascript" src="./realgrid-lic.js"></script>
		<script type="text/javascript" src="./realgrid.2.9.7.min.js"></script>
		<script type="text/javascript" src="/js/jquery-3.4.0.min.js"></script>
	</head>
	<body>
		<div id="master_grid" style="width: 100%; height: 440px;"></div>
        <div id="detail_grid" style="width: 100%; height: 440px;"></div>
	</body>
</html>

<script>
    // 2. <마스터 디테일>
    // 상단 그리드에서 특정 셀을 선택하면 해당하는 OrderID의 상세 정보를 하단 그리드에서 확인할 수 있다.
	document.addEventListener("DOMContentLoaded", function () {
        // 상단 그리드
		const provider_master = new RealGrid.LocalDataProvider();
		const gridView_master = new RealGrid.GridView("master_grid");
		gridView_master.setDataSource(provider_master);

        // 하단 그리드 (상세 정보)
        const provider_detail = new RealGrid.LocalDataProvider();
        const gridView_detail = new RealGrid.GridView("detail_grid");
        gridView_detail.setDataSource(provider_detail);

        // [1] 필드 & 칼럼 지정
		// master 필드
        provider_master.setFields([
            { fieldName: "OrderID" },
            { fieldName: "CustomerID" },
            { fieldName: "CompanyName" },
        ]);

        // master 칼럼
        gridView_master.setColumns([
            { name: "오더ID", fieldName: "OrderID"},
            { name: "커스텀ID", fieldName: "CustomerID"},
            { name: "컴퍼니Name", fieldName: "CompanyName"},
        ]);
        
        // detail 필드
        provider_detail.setFields([
            { fieldName: "OrderID" },
            { fieldName: "ProductName" },
            { fieldName: "UnitPrice" },
        ]);

        // detail 칼럼
        gridView_detail.setColumns([
            { name: "오더ID", fieldName: "OrderID"},
            { name: "프로덕트Name", fieldName: "ProductName"},
            { name: "유닛Price", fieldName: "UnitPrice"},
        ]);

        // [2] JSON 데이터 지정
        var master_data = [
            { OrderID: 10248, CustomerID: "VINET", CompanyName: "Vins et alcools Chevalier" },
            { OrderID: 10249, CustomerID: "TOMSP", CompanyName: "Toms Spezialitäten"        },
        ];

        var detail_data = [
            { OrderID: 10248, ProductName: "Queso Cabrales",         UnitPrice: 14,   Quantity: 12 },
            { OrderID: 10248, ProductName: "Singaporean Fried Mee",  UnitPrice: 9.8,  Quantity: 10 },
            { OrderID: 10248, ProductName: "Mozzarella di Giovanni", UnitPrice: 34.8, Quantity: 5  },
            { OrderID: 10249, ProductName: "Tofu",                   UnitPrice: 18.6, Quantity: 9  },
            { OrderID: 10249, ProductName: "Manjimup Dried Apples",  UnitPrice: 42.4, Quantity: 40 },
        ];

        // [3] 그리드에 JSON 데이터 채우기
        provider_master.fillJsonData(master_data, { fillMode: "set" });
        //provider_detail.fillJsonData(detail_data, { fillMode: "set" });

        // [4] master 그리드의 데이터가 선택되었을 때 처리
        gridView_master.onCurrentRowChanged = function(grid, oldRow, newRow) {
            provider_detail.clearRows(); // 그리드의 기존 데이터는 삭제
            if (newRow < 0) return;      // 새로 선택된 row가 없으면 return
        
            var key = parseInt(provider_master.getValue(newRow, "OrderID")); // 선택된 newRow의 OrderID를 가져옴 (key)
            var datas = detail_data.filter(function(element) {
                return element.OrderID === key; // 그리드 데이터의 OrderID와 key가 일치하는 경우의 데이터를 return
            });

            provider_detail.setRows(datas);
        }

	});	
</script>
